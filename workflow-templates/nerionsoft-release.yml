name: Release

# Releases always come from main, even when the default branch is integration.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: NerionSoft/nerionsoft-cicd/.github/workflows/reusable-release.yml@main
    # with:
    #   release-type: "node"
    #   target-branch: "main"
    #   update-floating-tags: true
    #   backmerge-branch: "integration"   # or "integration/<repo name>"; "" = off
    #   backmerge-auto-merge: true        # merge commit when no conflict
    # Org secret: Release Please and the backmerge act as the nerionsoft-release
    # App, so the release and backmerge pull requests run CI.
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # Build & push the image, only when Release Please cuts a release.
