name: pnpm overrides audit

# Checks every Monday that each pnpm override is still needed (stale, absent,
# unbounded or vulnerability-creating entries fail the run). Scheduled runs
# always use the default branch; run it by hand on another branch from the
# Actions tab.
on:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC (06:00 or 07:00 in Paris)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overrides:
    uses: NerionSoft/nerionsoft-cicd/.github/workflows/reusable-pnpm-overrides-audit.yml@main
    # with:
    #   working-directory: "."   # folder holding package.json and pnpm-lock.yaml
    #   report-only: false       # true = report without failing (while cleaning up)
    #   node-version: "26"
